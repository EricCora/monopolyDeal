services:
  - type: web
    name: monopolydeal-multiplayer
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start:multiplayer-server
    healthCheckPath: /api/multiplayer/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MULTIPLAYER_SOCKET_ENABLED
        value: true
      - key: MULTIPLAYER_PUSH_ENABLED
        value: true
      - key: MULTIPLAYER_REACTIONS_ENABLED
        value: true
      - key: MP_RECONNECT_GRACE_MS
        value: 90000
